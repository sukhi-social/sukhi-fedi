<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ナタデコ</title>
    <script>
      // 描画の前に、前回選んだ色(あれば)を当てる ── あとから切り替えると
      // 一瞬ちらつくので。選んでいなければ何もしない(端末の設定のまま)。
      try {
        var t = localStorage.getItem('nd.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <!-- 見出し・ボタン・タブだけ丸ゴシック。本文は読みやすさ優先で system sans のまま
         ── 冒険はここ一箇所に集める。 -->
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div>%sveltekit.body%</div>
  </body>
</html>
