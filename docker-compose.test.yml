#
# Compose file for integration / E2E tests.
#
# Brings up an isolated Postgres, plain core NATS, and the Bun fedify
# NATS Micro service. Elixir tests run on the host via
# `mix test --only integration` and connect to these services on the ports
# below.
#
# Ports are offset from the dev stack so both can run concurrently.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   (cd elixir && MIX_ENV=test mix test --only integration)
#   docker compose -f docker-compose.test.yml down -v
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sukhi_fedi_test
    ports:
      - "15432:5432"
    tmpfs:
      - /var/lib/postgresql/data  # ephemeral for test speed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  nats:
    image: nats:2-alpine
    command: ["--http_port", "8222"]
    ports:
      - "14222:4222"
      - "18222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.5
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: testaccess
      RUSTFS_SECRET_KEY: testsecret
    ports:
      - "19000:9000"
    tmpfs:
      - /data

  fedify-service:
    build:
      context: ./bun
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
    command: ["bun", "run", "services/fedify_service.ts"]
