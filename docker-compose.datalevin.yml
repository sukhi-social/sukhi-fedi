#
# The business data lives in Datalevin (docs/DATALEVIN.md); PostgreSQL holds
# the job queues and the raw bodies. This gives the gateway its Datalevin
# directory, on a volume. Layer it over the combined stack — Datalevin has
# one writer, so gateway and delivery must be the one BEAM:
#
#   docker compose -f docker-compose.yml -f docker-compose.combined.yml \
#                  -f docker-compose.datalevin.yml up -d
#
# There is no migration from an earlier Postgres-store instance: this starts
# empty (TODO.md).

services:
  gateway:
    environment:
      DATALEVIN_DIR: /var/lib/sukhi/datalevin
    volumes:
      - sukhi_data:/var/lib/sukhi

volumes:
  sukhi_data:
