# メンテナンスの頁(http ブロックに一度だけ)── /etc/nginx/conf.d/sukhi-maintenance.conf
#
# 意図: アプリが止まっている間に来た人に、「壊れた」ではなく「いま整えています」を見せる。
#       人には頁、ほかのサーバーやアプリには、あとでまた来てと伝える 503(Retry-After つき)を返す。
# 読み手(運営)の問題の仮説: 止めるたびに nginx の設定を書き換えたくない。戻し忘れが怖い。
#
# ここには「どの要求に、どの言語の、どのファイルを返すか」だけがある。
# 切り替えの旗(on)と、返すファイルは、箱の上の /srv/sukhi-maintenance にあり、
# scripts/sukhi-maintenance が書く。nginx の設定は、止めるたびに触らない。
# 手順は docs/OPS_MAINTENANCE_PAGE.ja.md。
#
# 頁を出す条件は三つ(どれか): ① 旗がある(予定した停止) ② nodeinfo が答えない(アプリが動いていない)
#   ③ 奥が 502/504(つながらない・時間切れ)。頁は、アプリとは別の **静的サーバー**(下の sukhi_maint_static)に取りに行く。
# nodeinfo など連合の口は、落ちているとき、ごまかさず 503(JSON)で「落ちている」と返す。

# ── ことば ──────────────────────────────────────────────────────
# 決め方は web-next と同じ順: ?lang= → cookie(sukhi_locale)→ Accept-Language
#   → 持っていない言語だけを挙げる人は en、何も挙げない人は ja。
# (Accept-Language は、先頭の印を先に、つぎに「並びのどこかに ja/ko/en があるか」を見る。
#  アプリの detectLocale のような、並びを順に追う完全な読みではない。)
map $http_accept_language $sukhi_maint_lang_al {
    default             en;
    ""                  ja;
    "~*^\s*ja"          ja;
    "~*^\s*ko"          ko;
    "~*^\s*en"          en;
    "~*(^|,)\s*ja"      ja;
    "~*(^|,)\s*ko"      ko;
    "~*(^|,)\s*en"      en;
}

map "$arg_lang|$cookie_sukhi_locale|$sukhi_maint_lang_al" $sukhi_maint_lang {
    default                             ja;
    "~^(?<l>ja|ko|en)\|"                $l;
    "~^[^|]*\|(?<l>ja|ko|en)\|"         $l;
    "~\|(?<l>ja|ko|en)$"                $l;
}

# ── だれに、頁を返すか ───────────────────────────────────────────
# 頁は、人が見ている窓(GET/HEAD で、Accept に text/html があり、json を望んでいない)にだけ。
# ActivityPub の取得(Accept: application/activity+json)、API、POST、画像などには、
# 頁ではなく短い JSON の 503 を返す(HTML を連合の相手に返さない)。
map "$request_method:$http_accept" $sukhi_maint_wants {
    default                         machine;
    "~*^(GET|HEAD):.*json"          machine;
    "~*^(GET|HEAD):.*text/html"     page;
}

# 人の窓でも、連合・API・メディアの道は、頁にしない。
map "$sukhi_maint_wants:$uri" $sukhi_maint_kind {
    default                                                                                machine;
    "~^page:/(api|oauth|users|inbox|nodeinfo|\.well-known|uploads|proxy|static|pull|metrics|up)(/|$)"   machine;
    "~^page:/"                                                                              page;
}

# ── 眠っている間も答える文書(FEP-f799 の制御の文書・お知らせ) ───────────
# 休んでいる間に、相手が「たしかにそのお知らせは本人のものか」を確かめに来る(actor・inbox の
# コレクション・WebFinger・お知らせそのもの)。アプリが答えられないので、あらかじめ作って
# 置いた静的ファイル(/srv/sukhi-maintenance/www/doc/<URL の道>.json)で答える ── 2xx で。
# 先に探しに行くのは GET/HEAD で、人の窓ではないものだけ。POST(inbox への配送)は、
# 同じ URL でも 503 のまま(受け取る責任を持てないものに 2xx を返さない)。
# WebFinger は、origin を訊かれたときだけ(acct: を訊かれても、origin の答えは返さない)。
# 道の文字を絞るのは、静的サーバーへ渡す URL を、おかしな文字から守るため(道は最後に置いて、末尾まで確かめる)。
# どれも当たらなければ、これまでどおり(頁か、JSON の 503)。
map "$request_method:$sukhi_maint_wants:$arg_resource:$uri" $sukhi_maint_try {
    default                                                                          none;
    "~^(GET|HEAD):machine:https%3A%2F%2F[A-Za-z0-9.%-]+:/\.well-known/webfinger$"    doc;
    "~^[A-Z]+:[a-z]+:[^:]*:/\.well-known/webfinger$"                                 none;
    "~^(GET|HEAD):machine:[^:]*:/[A-Za-z0-9._~@/-]{0,200}$"                          doc;
}

# 止まっているあいだの 503 に添える `Link: <お知らせ>; rel="…#deliverySuspension"`。
# 中身は scripts/sukhi-maintenance の notice が書く(空なら、何も添えない)。
# このファイルは、一度だけ作っておく(空でよい)。書き換えたら nginx に読み直させる。
map $request_uri $sukhi_maint_link {
    default "";
    include /srv/sukhi-maintenance/link.map;
}

# ── 静的サーバー ─────────────────────────────────────────────────
# メンテナンスの頁だけを配る、アプリとは別の小さなサーバー。アプリ(Anubis・gateway・web-next)が
# 全部止まっていても答える。ここは「ファイルを返すだけ」で、状態(503 や Retry-After)は前の server が付ける。
# 別の箱や外の静的ホスティングに置くなら、下の upstream の行だけを、その行き先に替える。
upstream sukhi_maint_static {
    server 127.0.0.1:8083;
    keepalive 2;
}

server {
    listen 127.0.0.1:8083;
    server_name _;
    root /srv/sukhi-maintenance/www;
    access_log off;
    autoindex off;
    # ここの頁は、前の server を通ってだけ見せる。ファイル名を直接たたかれても、置いたものを返すだけ。
    location ~ ^/maintenance\.(ja|ko|en)\.html$ { try_files $uri =404; }
    # 眠っている間も答える文書。URL の道に `.json` を足したものが、www/doc の下にある。
    # 読むだけ(GET/HEAD)。前の server が頼むのも GET/HEAD だけだが、ここでも閉じておく。
    location ~ ^/doc/.+\.json$ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
    location / { return 404; }
}

# ── 動いているかの診断(nodeinfo) ─────────────────────────────────
# 答えを 2〜5 秒だけ置いて、アクセスのたびにアプリを叩かないようにする(置くのは診断だけ。nodeinfo 本体の答えは置かない)。
proxy_cache_path /var/cache/nginx/sukhi-health levels=1 keys_zone=sukhi_health:1m max_size=1m inactive=1m use_temp_path=off;
