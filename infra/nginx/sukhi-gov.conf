#
# web-gov(迎える人の道具)── /etc/nginx/conf.d/sukhi-gov.conf
#
# 意図: gov.sukhi.social に、web-gov の静的なファイル(web-gov/dist)だけを返す。
#       アプリ(gateway・web-next)は通さない。gov は、ログインして得たトークンで、
#       ブラウザから sukhi.social の API を直接呼ぶ(CORS は gateway が許している)。
# 読み手(運営)の問題の仮説: 道具の頁を、アプリの再起動に巻き込みたくない。置くのは build の結果だけでよい。
#
# 置き場: /srv/sukhi-gov(`pnpm build` の dist の中身をそのまま)。手順は docs/JOIN.md「Putting web-gov up」。
# 証明書は Cloudflare の Origin CA(下)。

server {
    listen 80;
    server_name gov.sukhi.social;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gov.sukhi.social;

    # Cloudflare の Origin CA 証明書(ダッシュボードで作って箱に置く。鍵は 0600・root だけ)。
    # Cloudflare の SSL モードは Full (strict)。
    ssl_certificate     /etc/nginx/ssl/gov.sukhi.social.pem;
    ssl_certificate_key /etc/nginx/ssl/gov.sukhi.social.key;

    # Cloudflare(オレンジ雲)が origin につなぐとき、ポスト量子の混成グループを先に出す。
    # 許さないと 525(error_log を info にすると "no suitable key share")。箱の OpenSSL 3.5 の nginx の場合。
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;

    root /srv/sukhi-gov;
    index index.html;

    # 頁は自分と、sukhi.social の API だけとつながる。外のスクリプトは読まない。
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://sukhi.social; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # 検索に出さない(道具の頁)
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ファイル名に内容の印が入っている assets/ は長く、入口の index.html は毎回たしかめる。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'none'" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        # hash の経路なので、頁は index.html ひとつ。ログインの戻り(/?code=…)もここ。
        try_files $uri /index.html;
    }
}
