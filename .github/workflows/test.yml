# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The tests, on every change that can break them. Until this file, nothing
# ran them: load-bench compiles and boots the Elixir code but runs no test,
# web-e2e watches only web/, and web-next had no workflow at all — so a PR
# touching only those could be green with its tests never run.
#
# Each job has its own `paths`, so a change runs exactly the suites that read
# the files it touched, and a new source directory is one more line here. The
# `push` trigger on main keeps main honest after a merge.
#
#   web-next       pnpm test (node --test, a mock gateway; no build step)
#   elixir-unit    make test-shared / -elixir / -api / -delivery (no DB)
#   elixir-pglite  make test-pglite: compile with warnings as errors,
#                  migrate, and run the DB integration suite on embedded PGlite
#                  (with dtlv installed, so the Datalevin graph tests run too)
name: test

on:
  pull_request:
    paths:
      - "web-next/**"
      - "elixir/**"
      - "api/**"
      - "shared/**"
      - "delivery/**"
      - "combined/**"
      - "bun/**"
      - "mise.toml"
      - "Makefile"
      - "scripts/test-pglite.sh"
      - ".github/workflows/test.yml"
  push:
    branches:
      - main
    paths:
      - "web-next/**"
      - "elixir/**"
      - "api/**"
      - "shared/**"
      - "delivery/**"
      - "combined/**"
      - "bun/**"
      - "mise.toml"
      - "Makefile"
      - "scripts/test-pglite.sh"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-next:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-next
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 24 reads the TypeScript as it is (no build), the same as the Dockerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  elixir-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cache deps and builds
        uses: actions/cache@v4
        with:
          path: |
            shared/deps
            shared/_build
            elixir/deps
            elixir/_build
            api/deps
            api/_build
            delivery/deps
            delivery/_build
          key: unit-${{ runner.os }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: unit-${{ runner.os }}-

      - name: Hex and rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Fetch deps
        run: |
          for d in shared elixir api delivery; do
            (cd "$d" && mix deps.get)
          done

      - run: make test-shared test-elixir test-api test-delivery

  elixir-pglite:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cache deps and builds
        uses: actions/cache@v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: pglite-${{ runner.os }}-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: pglite-${{ runner.os }}-

      - name: Hex and rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Fetch deps
        working-directory: elixir
        env:
          MIX_ENV: test
        run: mix deps.get

      # The graph tests (:dtlv) drive a real Datalevin, which is the active
      # store, so the job installs the binary rather than skipping them. Same
      # release and checksum as combined/Dockerfile; keep them in step.
      - name: Install dtlv
        env:
          DTLV_VERSION: 1.2.10
          DTLV_SHA256: b42c1ef4b6a9ccf2a42b21f9c576fe774ff877c15826031755f0b94a3c0df3e5
        run: |
          curl -fsSL -o "$RUNNER_TEMP/dtlv.zip" \
            "https://github.com/datalevin/datalevin/releases/download/${DTLV_VERSION}/dtlv-${DTLV_VERSION}-ubuntu-22.04-amd64.zip"
          echo "${DTLV_SHA256}  $RUNNER_TEMP/dtlv.zip" | sha256sum -c -
          sudo unzip -j -q "$RUNNER_TEMP/dtlv.zip" dtlv -d /usr/local/bin
          sudo chmod +x /usr/local/bin/dtlv
          dtlv --version || true

      # The suite logs every SQL query, so the failure list drowns in the job
      # log; keep a copy and print just the failures when the run goes red.
      - run: make test-pglite 2>&1 | tee "$RUNNER_TEMP/pglite.log"; exit "${PIPESTATUS[0]}"

      - name: Failed tests
        if: failure()
        run: grep -aE -A8 '^ +[0-9]+\) test ' "$RUNNER_TEMP/pglite.log" | head -400 || true
