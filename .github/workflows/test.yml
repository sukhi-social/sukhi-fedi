# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The tests, on every change that can break them. Until this file, nothing
# ran them: load-bench compiles and boots the Elixir code but runs no test,
# web-e2e watches only web/, and web-next had no workflow at all — so a PR
# touching only those could be green with its tests never run.
#
# Each job has its own `paths`, so a change runs exactly the suites that read
# the files it touched, and a new source directory is one more line here. The
# `push` trigger on main keeps main honest after a merge.
#
#   web-next       pnpm test (node --test, a mock gateway; no build step)
#   web-simple     node --test on its server and manifest (no install needed)
#   maintenance-page  the nginx rules on a real nginx, and the switch script
#                  (docs/OPS_MAINTENANCE_PAGE.ja.md); web-next's own part is in `web-next`
#   elixir-unit    make test-shared / -elixir / -api / -delivery (no DB)
#   elixir-pgrust  make test-pgrust: compile with warnings as errors,
#                  migrate, and run the integration suite: the business data
#                  in a throwaway Datalevin directory (dtlv installed), the
#                  job queues on a pgrust server (scripts/lib/pgrust.sh)
name: test

on:
  pull_request:
    paths:
      - "web-next/**"
      - "web/**"
      - "elixir/**"
      - "api/**"
      - "shared/**"
      - "delivery/**"
      - "combined/**"
      - "scripts/lib/pgrust.sh"
      - "mise.toml"
      - "Makefile"
      - "scripts/test-pgrust.sh"
      - "scripts/sukhi-maintenance*"
      - "infra/nginx/**"
      - ".github/workflows/test.yml"
  push:
    branches:
      - main
    paths:
      - "web-next/**"
      - "web/**"
      - "elixir/**"
      - "api/**"
      - "shared/**"
      - "delivery/**"
      - "combined/**"
      - "scripts/lib/pgrust.sh"
      - "mise.toml"
      - "Makefile"
      - "scripts/test-pgrust.sh"
      - "scripts/sukhi-maintenance*"
      - "infra/nginx/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-next:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-next
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 24 reads the TypeScript as it is (no build), the same as the Dockerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  # web-simple's own server and the manifest it hands the gateway. The SPA's
  # browser tests are web-e2e.yml; this is the part that is now an image.
  web-simple:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node --test "serve/*.test.mjs" "scripts/*.test.mjs"

  # The page nginx answers with while the app is down. Reads web-next/server as it
  # is (Node 24 strips the types), so no install; nginx comes from apt.
  maintenance-page:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: sudo apt-get update && sudo apt-get install -y nginx-light

      - run: make test-nginx test-maintenance

  elixir-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cache deps and builds
        uses: actions/cache@v4
        with:
          path: |
            shared/deps
            shared/_build
            elixir/deps
            elixir/_build
            api/deps
            api/_build
            delivery/deps
            delivery/_build
          key: unit-${{ runner.os }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: unit-${{ runner.os }}-

      - name: Hex and rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Fetch deps
        run: |
          for d in shared elixir api delivery; do
            (cd "$d" && mix deps.get)
          done

      - run: make test-shared test-elixir test-api test-delivery

  elixir-pgrust:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cache deps and builds
        uses: actions/cache@v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: pgrust-${{ runner.os }}-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: pgrust-${{ runner.os }}-

      - name: Hex and rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Fetch deps
        working-directory: elixir
        env:
          MIX_ENV: test
        run: mix deps.get

      # Datalevin is the store, so every integration test needs the binary.
      # Same release and checksum as combined/Dockerfile; keep them in step.
      - name: Install dtlv
        env:
          DTLV_VERSION: 1.2.10
          DTLV_SHA256: b42c1ef4b6a9ccf2a42b21f9c576fe774ff877c15826031755f0b94a3c0df3e5
        run: |
          curl -fsSL -o "$RUNNER_TEMP/dtlv.zip" \
            "https://github.com/datalevin/datalevin/releases/download/${DTLV_VERSION}/dtlv-${DTLV_VERSION}-ubuntu-22.04-amd64.zip"
          echo "${DTLV_SHA256}  $RUNNER_TEMP/dtlv.zip" | sha256sum -c -
          sudo unzip -j -q "$RUNNER_TEMP/dtlv.zip" dtlv -d /usr/local/bin
          sudo chmod +x /usr/local/bin/dtlv
          dtlv --version || true

      # The suite logs every SQL query, so the failure list drowns in the job
      # log; keep a copy and print just the failures when the run goes red.
      # pgrust is fetched by the script, checked against the checksum pinned in
      # scripts/lib/pgrust.sh; keep the download between runs.
      - name: Cache pgrust
        uses: actions/cache@v4
        with:
          path: .pgrust
          key: pgrust-bin-${{ runner.os }}-${{ hashFiles('scripts/lib/pgrust.sh') }}

      - run: make test-pgrust 2>&1 | tee "$RUNNER_TEMP/pgrust.log"; exit "${PIPESTATUS[0]}"

      - name: Failed tests
        if: failure()
        run: grep -aE -A8 '^ +[0-9]+\) test ' "$RUNNER_TEMP/pgrust.log" | head -400 || true
