# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The tests, on every change that can break them. Until this file, nothing
# ran them: load-bench compiles and boots the Elixir code but runs no test,
# and web-next had no workflow at all — so a PR touching only those could
# be green with its tests never run.
#
# Each job has its own `paths`, so a change runs exactly the suites that read
# the files it touched, and a new source directory is one more line here. The
# `push` trigger on main keeps main honest after a merge.
#
#   web-next       pnpm test (node --test, a mock gateway; no build step)
#   maintenance-page  the nginx rules on a real nginx, and the switch script
#                  (docs/OPS_MAINTENANCE_PAGE.ja.md); web-next's own part is in `web-next`
#   elixir-unit    make test-shared / -elixir / -api / -delivery (no DB)
#   elixir-pgrust  make test-pgrust: compile with warnings as errors,
#                  migrate, and run the integration suite: the business data
#                  in a throwaway Datalevin directory (dtlv installed), the
#                  job queues on a pgrust server (scripts/lib/pgrust.sh)
name: test

on:
  pull_request:
    paths:
      - "web-next/**"
      - "elixir/**"
      - "api/**"
      - "shared/**"
      - "delivery/**"
      - "combined/**"
      - "scripts/lib/pgrust.sh"
      - "mise.toml"
      - "Makefile"
      - "scripts/test-pgrust.sh"
      - "scripts/sukhi-maintenance*"
      - "infra/nginx/**"
      - ".github/workflows/test.yml"
  push:
    branches:
      - main
    paths:
      - "web-next/**"
      - "elixir/**"
      - "api/**"
      - "shared/**"
      - "delivery/**"
      - "combined/**"
      - "scripts/lib/pgrust.sh"
      - "mise.toml"
      - "Makefile"
      - "scripts/test-pgrust.sh"
      - "scripts/sukhi-maintenance*"
      - "infra/nginx/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-next:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-next
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 24 reads the TypeScript as it is (no build), the same as the Dockerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  # The page nginx answers with while the app is down. Reads web-next/server as it
  # is (Node 24 strips the types), so no install; nginx comes from apt.
  maintenance-page:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: sudo apt-get update && sudo apt-get install -y nginx-light

      - run: make test-nginx test-maintenance

  elixir-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # The store is hosigraph: `hosi` compiles against libhosi (no prebuilt release yet).
      - uses: ./.github/actions/libhosi

      - name: Cache deps and builds
        uses: actions/cache@v4
        with:
          path: |
            shared/deps
            shared/_build
            elixir/deps
            elixir/_build
            api/deps
            api/_build
            delivery/deps
            delivery/_build
          key: unit-${{ runner.os }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: unit-${{ runner.os }}-

      - name: Hex and rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Fetch deps
        run: |
          for d in shared elixir api delivery; do
            (cd "$d" && mix deps.get)
          done

      - run: make test-shared test-elixir test-api test-delivery

  elixir-pgrust:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - uses: ./.github/actions/libhosi
        with:
          jar: "true"

      - name: Cache deps and builds
        uses: actions/cache@v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: pgrust-${{ runner.os }}-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: pgrust-${{ runner.os }}-

      - name: Hex and rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Fetch deps
        working-directory: elixir
        env:
          MIX_ENV: test
        run: mix deps.get

      # The suite logs every SQL query, so the failure list drowns in the job
      # log; keep a copy and print just the failures when the run goes red.
      # pgrust is fetched by the script, checked against the checksum pinned in
      # scripts/lib/pgrust.sh; keep the download between runs.
      - name: Cache pgrust
        uses: actions/cache@v4
        with:
          path: .pgrust
          key: pgrust-bin-${{ runner.os }}-${{ hashFiles('scripts/lib/pgrust.sh') }}

      - run: make test-pgrust 2>&1 | tee "$RUNNER_TEMP/pgrust.log"; exit "${PIPESTATUS[0]}"

      - name: Failed tests
        if: failure()
        run: grep -aE -A8 '^ +[0-9]+\) test ' "$RUNNER_TEMP/pgrust.log" | head -400 || true
