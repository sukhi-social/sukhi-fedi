# SPDX-License-Identifier: AGPL-3.0-or-later
#
# CodSpeed: the web-next server's rendering paths (MFM, emoji, BudouX,
# html``, time words, the timeline shuffle, status cards), measured under
# CPU simulation so the numbers hold still between runs. The benchmarks
# live in web-next/bench/ and run with `pnpm bench` (vitest bench).
# The `elixir` job below is the Elixir counterpart (walltime; see there).
name: codspeed

on:
  push:
    branches:
      - main
  pull_request:
  # Lets CodSpeed trigger backtest runs to build up initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web-next
        run: pnpm install --frozen-lockfile

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          working-directory: web-next
          run: pnpm bench

  # The Elixir side: pure paths (HTTP signatures, JCS hash, Markdown and the
  # HTML scrubber) through Benchee, in walltime mode, because simulation has
  # no Elixir support. Walltime needs CodSpeed's own runner (the label below
  # is theirs, not GitHub's) and shows real time, so it is only as steady as
  # that machine. The benchmarks live in elixir/bench/ (library:
  # sukhi-social/benchee_codspeed).
  elixir:
    name: Run Elixir benchmarks
    runs-on: codspeed-macro
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - uses: ./.github/actions/libhosi

      - name: Cache deps and builds
        uses: actions/cache@v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: codspeed-elixir-${{ runner.os }}-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            codspeed-elixir-${{ runner.os }}-

      - name: Dependencies and compile
        working-directory: elixir
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile

      # `+JPperf true` writes the BEAM's perf map, so the flame graph shows
      # function names instead of addresses.
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          working-directory: elixir
          run: ELIXIR_ERL_OPTIONS="+JPperf true" mix run --no-start bench/pure_bench.exs

  # The load benchmark (scripts/load/): the gateway booted with a seeded store, one benchmark per
  # route group (a fixed number of requests; scripts/load/codspeed.yml), in walltime mode. The
  # server is pinned to core 0, the client to core 1. `load-bench.yml` is the head-against-main
  # comparison on a shared runner; this is the history on a steady one.
  load:
    name: Run load benchmarks
    runs-on: codspeed-macro
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - uses: ./.github/actions/libhosi
        with:
          jar: "true"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache deps and builds
        uses: actions/cache@v4
        with:
          path: |
            combined/deps
            combined/_build
          key: codspeed-load-${{ runner.os }}-${{ hashFiles('combined/mix.lock') }}
          restore-keys: |
            codspeed-load-${{ runner.os }}-

      - name: Cache pgrust
        uses: actions/cache@v4
        with:
          path: .pgrust
          key: pgrust-bin-${{ runner.os }}-${{ hashFiles('scripts/lib/pgrust.sh') }}

      - name: Hex and rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Start the server
        env:
          OUT: ${{ runner.temp }}/load
        run: |
          scripts/load/codspeed-up.sh
          cat "$OUT/env" >> "$GITHUB_ENV"

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          config: scripts/load/codspeed.yml

      - name: Stop the server
        if: always()
        env:
          OUT: ${{ runner.temp }}/load
        run: scripts/load/codspeed-down.sh
