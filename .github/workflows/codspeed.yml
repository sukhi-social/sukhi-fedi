# SPDX-License-Identifier: AGPL-3.0-or-later
#
# CodSpeed: the web-next server's rendering paths (MFM, emoji, BudouX,
# html``, time words, the timeline shuffle, status cards), measured under
# CPU simulation so the numbers hold still between runs. The benchmarks
# live in web-next/bench/ and run with `pnpm bench` (vitest bench).
name: codspeed

on:
  push:
    branches:
      - main
  pull_request:
  # Lets CodSpeed trigger backtest runs to build up initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web-next
        run: pnpm install --frozen-lockfile

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          working-directory: web-next
          run: pnpm bench
