# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Builds the `combined` image (sukhi's gateway + delivery + api, one BEAM)
# for linux/arm64 and pushes it to GHCR under `sha-<commit>` only.
#
# Deliberately separate from release.yml: that workflow stitches semver
# tags and `latest` onto the public images. A branch build must never
# move those, so this one writes a single immutable sha tag and nothing else.
#
# Triggers: a push to refactor/web-batches, or a manual run.

name: combined-sha

on:
  push:
    branches:
      - refactor/web-batches
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3.10.0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: combined/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sukhi-fedi-combined:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=combined-arm64
          cache-to: type=gha,scope=combined-arm64,mode=max
