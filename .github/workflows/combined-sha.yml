# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Builds the `combined` image (sukhi's gateway + delivery + api, one BEAM)
# for linux/arm64 and pushes it to GHCR under `sha-<commit>` only.
#
# Deliberately separate from release.yml: that workflow stitches semver
# tags and `latest` onto the public images. A branch build must never
# move those, so this one writes a single immutable sha tag and nothing else.
#
# Triggers: a push to main (every commit builds its own sha tag; deploying it
# is still a separate, manual step), a push to refactor/web-batches, or a
# manual run.
#
# The two small images that run beside `combined` are built here too, from
# the same commit, under the same `sha-<commit>` tag, so "production is at
# sha-abc1234" means all three. There is deliberately no path filter: with
# one, a commit that didn't touch an image would have no tag for it, and
# "the same sha everywhere" would stop being true.
#   - sukhi-fedi-anubis       config/anubis (one image for sukhi and natadeco;
#                              the imprint is picked by IMPRINT_FILE)
#   - sukhi-fedi-natadeco-ssr web-natadeco (the SSR Node for natadeco.com;
#                              its build/client must match the files served from
#                              the override dir, which come from the same commit)
#   - sukhi-fedi-web-next     web-next (the Unpoly + Alpine.js post office that
#                              sits in front of the gateway; no build step)

name: combined-sha

on:
  push:
    branches:
      - main
      - refactor/web-batches
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3.10.0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Build only the stages that rarely change, and export the layer cache
      # from just those. The full build below reads that cache but doesn't
      # write one: its layers (SPA output, the release) differ on every
      # commit, so uploading them cost ~14s per run for nothing.
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: combined/Dockerfile
          target: cache-warm
          platforms: linux/arm64
          outputs: type=cacheonly
          cache-from: type=gha,scope=combined-arm64
          # zstd, not the default gzip: writing the cache took ~60s of the
          # 176s cold run (run 38718204455); zstd compresses faster.
          cache-to: type=gha,scope=combined-arm64,mode=max,compression=zstd

      - id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: combined/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sukhi-fedi-combined:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=combined-arm64

      - uses: sigstore/cosign-installer@v3.7.0

      - name: Sign
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/sukhi-fedi-combined@${{ steps.push.outputs.digest }}

  anubis:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3.10.0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Policy and imprints on top of a pinned Anubis base: a few COPY lines,
      # so there is no layer cache worth keeping.
      - id: push
        uses: docker/build-push-action@v5
        with:
          context: config/anubis
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sukhi-fedi-anubis:${{ steps.tag.outputs.sha }}

      - uses: sigstore/cosign-installer@v3.7.0

      - name: Sign
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/sukhi-fedi-anubis@${{ steps.push.outputs.digest }}

  ssr:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3.10.0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: push
        uses: docker/build-push-action@v5
        with:
          context: web-natadeco
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sukhi-fedi-natadeco-ssr:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=ssr-arm64
          cache-to: type=gha,scope=ssr-arm64,mode=max,compression=zstd

      - uses: sigstore/cosign-installer@v3.7.0

      - name: Sign
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/sukhi-fedi-natadeco-ssr@${{ steps.push.outputs.digest }}

  web-next:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3.10.0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: push
        uses: docker/build-push-action@v5
        with:
          context: web-next
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sukhi-fedi-web-next:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=web-next-arm64
          cache-to: type=gha,scope=web-next-arm64,mode=max,compression=zstd

      - uses: sigstore/cosign-installer@v3.7.0

      - name: Sign
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/sukhi-fedi-web-next@${{ steps.push.outputs.digest }}
