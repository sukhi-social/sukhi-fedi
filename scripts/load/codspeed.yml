#
# The load benchmark as CodSpeed walltime benchmarks: one per route group, a fixed number of
# requests against a server that codspeed-up.sh started (.github/workflows/codspeed.yml, job
# `load`). Run by `CodSpeedHQ/action` with `config: scripts/load/codspeed.yml`.
# The server is pinned to core 0 (codspeed-up.sh), the client to core 1.
$schema: https://raw.githubusercontent.com/CodSpeedHQ/codspeed/refs/heads/main/schemas/codspeed.schema.json
options:
  working-directory: ../..
  warmup-time: 1s
  max-time: 20s
benchmarks:
  - name: load public timeline (400 req)
    exec: taskset -c 1 node scripts/load/bench.mjs public
  - name: load home timeline (400 req)
    exec: taskset -c 1 node scripts/load/bench.mjs home
  - name: load instance (400 req)
    exec: taskset -c 1 node scripts/load/bench.mjs instance
  - name: load nodeinfo (400 req)
    exec: taskset -c 1 node scripts/load/bench.mjs nodeinfo
