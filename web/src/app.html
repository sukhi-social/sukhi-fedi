<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget=resizes-content: ソフトキーボードが出たら、覆う
         のではなく画面そのものを縮める。これが無いと、下に貼りついた入力欄
         (メッセージの返信箱)がキーボードの裏に隠れる ── 打っている場所が
         見えないまま打つことになる。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta name="description" content="しずかな Fediverse のお家。" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- manifest は CSS 変数を読めないので、色はここと manifest の二箇所に
         綴られる。tokens.css の --color-bg と揃えること。 -->
    <meta name="theme-color" content="#efeee7" />
    <title>sukhi-fedi</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
